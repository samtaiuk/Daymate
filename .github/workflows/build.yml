name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: unzip -q DayMate.zip
      - run: printf "android.useAndroidX=true\norg.gradle.jvmargs=-Xmx2g\n" > DayMate/gradle.properties
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - run: gradle assembleDebug
        working-directory: DayMate
      - uses: actions/upload-artifact@v4
        with:
          name: DayMate-apk
          path: DayMate/app/build/outputs/apk/debug/app-debug.apk
